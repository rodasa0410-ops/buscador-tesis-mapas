<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de Tesis y Mapas</title>
<style>
  :root {
    --azul-rey: #1e3a8a;
    --azul-rey-oscuro: #152a66;
    --azul-claro: #e8eefb;
    --plata: #d9dde3;
    --plata-claro: #f2f4f7;
    --texto: #1f2937;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    background: var(--plata-claro);
    color: var(--texto);
  }

  header {
    background: linear-gradient(135deg, var(--azul-rey), var(--azul-rey-oscuro));
    color: #fff;
    padding: 22px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .18);
  }

  .lobo {
    width: 80px;
    height: 80px;
    background: #fff;
    border-radius: 50%;
    padding: 8px;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .25);
  }

  header h1 {
    margin: 0;
    font-size: 26px;
  }

  header p {
    margin: 5px 0 0;
    font-size: 14px;
    color: var(--plata);
  }

  main {
    max-width: 1150px;
    margin: 25px auto;
    padding: 0 16px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .tab {
    padding: 11px 22px;
    border: none;
    border-radius: 10px;
    background: var(--plata);
    color: var(--azul-rey-oscuro);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }

  .tab:hover {
    background: #c7ccd4;
  }

  .tab.active {
    background: var(--azul-rey);
    color: #fff;
    box-shadow: 0 3px 8px rgba(30, 58, 138, .35);
  }

  .filtros {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--plata);
    border-radius: 10px;
    background: #fff;
    font-size: 15px;
    color: var(--texto);
    outline: none;
    transition: .2s;
  }

  input:focus, select:focus {
    border-color: var(--azul-rey);
    box-shadow: 0 0 0 3px rgba(30, 58, 138, .15);
  }

  .buscador-general {
    margin-bottom: 18px;
  }

  .tarjeta {
    background: #fff;
    border: 1px solid var(--plata);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .06);
  }

  .status {
    font-size: 14px;
    color: var(--azul-rey-oscuro);
    background: var(--azul-claro);
    border-left: 5px solid var(--azul-rey);
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    border-radius: 10px;
    overflow: hidden;
  }

  th {
    background: var(--azul-rey);
    color: #fff;
    padding: 12px 10px;
    text-align: left;
    font-size: 14px;
  }

  td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--plata);
    font-size: 14px;
  }

  tbody tr:nth-child(even) {
    background: var(--plata-claro);
  }

  tbody tr:hover {
    background: var(--azul-claro);
  }

  .oculto {
    display: none;
  }

  footer {
    text-align: center;
    padding: 18px;
    color: #6b7280;
    font-size: 13px;
  }

  @media (max-width: 720px) {
    header {
      flex-direction: column;
      text-align: center;
    }

    .filtros {
      grid-template-columns: 1fr;
    }

    table {
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }
  }
</style>
</head>
<body>

<header>
  <div class="lobo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M25 20 L38 38 L62 38 L75 20 L72 52 C72 70 62 82 50 82 C38 82 28 70 28 52 Z" fill="#9aa3ad"/>
      <path d="M28 52 C28 70 38 82 50 82 C62 82 72 70 72 52 C72 40 62 34 50 34 C38 34 28 40 28 52 Z" fill="#b8bfc7"/>
      <path d="M38 38 L34 22 L46 34 Z" fill="#8d959e"/>
      <path d="M62 38 L66 22 L54 34 Z" fill="#8d959e"/>
      <circle cx="41" cy="55" r="4.5" fill="#1e3a8a"/>
      <circle cx="59" cy="55" r="4.5" fill="#1e3a8a"/>
      <circle cx="42.5" cy="53.5" r="1.4" fill="#fff"/>
      <circle cx="60.5" cy="53.5" r="1.4" fill="#fff"/>
      <path d="M44 68 Q50 74 56 68" stroke="#4b5563" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="64" rx="4" ry="3" fill="#6b7280"/>
    </svg>
  </div>

  <div>
    <h1>Buscador de Tesis y Mapas</h1>
    <p>Consulta rápida de tesis tituladas y mapas del plantel</p>
  </div>
</header>

<main>

  <div class="tabs">
    <button class="tab active" onclick="showTab('tesis', this)">Tesis</button>
    <button class="tab" onclick="showTab('mapas', this)">Mapas</button>
  </div>

  <div id="filtros-tesis" class="filtros">
    <input
      id="filtro-titulo"
      type="text"
      placeholder="Filtrar por título de la tesis..."
      oninput="render()"
    >

    <select id="filtro-carrera" onchange="render()">
      <option value="">Todas las carreras</option>
    </select>
  </div>

  <input
    id="buscador"
    class="buscador-general"
    type="search"
    placeholder="Búsqueda general: número, título, titulado, carrera, año, clave, estado o ubicación..."
    oninput="render()"
  >

  <div id="seccion-tesis" class="tarjeta">
    <div class="status" id="estado-tesis">Cargando tesis...</div>

    <table>
      <thead>
        <tr>
          <th>Número de tesis</th>
          <th>Nombre de tesis</th>
          <th>Nombre del titulado</th>
          <th>Carrera</th>
          <th>Año</th>
          <th>Ubicación</th>
        </tr>
      </thead>
      <tbody id="tabla-tesis"></tbody>
    </table>
  </div>

  <div id="seccion-mapas" class="tarjeta oculto">
    <div class="status" id="estado-mapas">Cargando mapas...</div>

    <table>
      <thead>
        <tr>
          <th>Clave del mapa</th>
          <th>Estado</th>
          <th>Ubicación</th>
        </tr>
      </thead>
      <tbody id="tabla-mapas"></tbody>
    </table>
  </div>

</main>

<footer>
  Buscador institucional de tesis y mapas
</footer>

<script>
// SUSTITUYE ESTAS URLS por las de "Publicar en la web" como CSV
const URL_TESIS = "PEGA_AQUI_LA_URL_CSV_DE_TESIS";
const URL_MAPAS = "PEGA_AQUI_LA_URL_CSV_DE_MAPAS";

let tesis = [];
let mapas = [];

async function cargarCSV(url) {
  const respuesta = await fetch(url);
  const texto = await respuesta.text();
  return parsearCSV(texto);
}

function parsearCSV(texto) {
  const lineas = texto.trim().split(/\r?\n/);
  const encabezados = dividirLineaCSV(lineas[0]);

  return lineas
    .slice(1)
    .filter(linea => linea.trim() !== "")
    .map(linea => {
      const valores = dividirLineaCSV(linea);
      const objeto = {};

      encabezados.forEach((encabezado, indice) => {
        objeto[encabezado.trim()] = (valores[indice] || "").trim();
      });

      return objeto;
    });
}

function dividirLineaCSV(linea) {
  const resultado = [];
  let actual = "";
  let entreComillas = false;

  for (let i = 0; i < linea.length; i++) {
    const caracter = linea[i];

    if (caracter === '"') {
      if (entreComillas && linea[i + 1] === '"') {
        actual += '"';
        i++;
      } else {
        entreComillas = !entreComillas;
      }
    } else if (caracter === "," && !entreComillas) {
      resultado.push(actual);
      actual = "";
    } else {
      actual += caracter;
    }
  }

  resultado.push(actual);
  return resultado;
}

function normalizar(texto) {
  return (texto || "")
    .toString()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function cargarCarreras() {
  const select = document.getElementById("filtro-carrera");
  const carreras = [...new Set(
    tesis
      .map(t => (t.carrera || "").trim())
      .filter(carrera => carrera !== "")
  )].sort();

  carreras.forEach(carrera => {
    const opcion = document.createElement("option");
    opcion.value = carrera;
    opcion.textContent = carrera;
    select.appendChild(opcion);
  });
}

function render() {
  const busquedaGeneral = normalizar(document.getElementById("buscador").value);
  const filtroTitulo = normalizar(document.getElementById("filtro-titulo").value);
  const filtroCarrera = document.getElementById("filtro-carrera").value;

  const tesisFiltradas = tesis.filter(t => {
    const coincideBusquedaGeneral =
      normalizar(Object.values(t).join(" ")).includes(busquedaGeneral);

    const coincideTitulo =
      normalizar(t.nombre_tesis).includes(filtroTitulo);

    const coincideCarrera =
      filtroCarrera === "" || (t.carrera || "").trim() === filtroCarrera;

    return coincideBusquedaGeneral && coincideTitulo && coincideCarrera;
  });

  const mapasFiltrados = mapas.filter(m =>
    normalizar(Object.values(m).join(" ")).includes(busquedaGeneral)
  );

  document.getElementById("tabla-tesis").innerHTML = tesisFiltradas.map(t => `
    <tr>
      <td>${t.numero_tesis || ""}</td>
      <td>${t.nombre_tesis || ""}</td>
      <td>${t.nombre_titulado || ""}</td>
      <td>${t.carrera || ""}</td>
      <td>${t.anio || ""}</td>
      <td>${t.ubicacion || ""}</td>
    </tr>
  `).join("");

  document.getElementById("tabla-mapas").innerHTML = mapasFiltrados.map(m => `
    <tr>
      <td>${m.clave_mapa || ""}</td>
      <td>${m.estado || ""}</td>
      <td>${m.ubicacion || ""}</td>
    </tr>
  `).join("");

  document.getElementById("estado-tesis").textContent =
    `${tesisFiltradas.length} tesis encontradas`;

  document.getElementById("estado-mapas").textContent =
    `${mapasFiltrados.length} mapas encontrados`;
}

function showTab(tab, boton) {
  document.getElementById("seccion-tesis").classList.toggle("oculto", tab !== "tesis");
  document.getElementById("seccion-mapas").classList.toggle("oculto", tab !== "mapas");
  document.getElementById("filtros-tesis").classList.toggle("oculto", tab !== "tesis");

  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  boton.classList.add("active");
}

(async function iniciar() {
  try {
    tesis = await cargarCSV(URL_TESIS);
    cargarCarreras();
    document.getElementById("estado-tesis").textContent =
      `${tesis.length} tesis cargadas`;
  } catch (error) {
    document.getElementById("estado-tesis").textContent =
      "Error al cargar la hoja de tesis. Revisa que la URL CSV sea correcta.";
  }

  try {
    mapas = await cargarCSV(URL_MAPAS);
    document.getElementById("estado-mapas").textContent =
      `${mapas.length} mapas cargados`;
  } catch (error) {
    document.getElementById("estado-mapas").textContent =
      "Error al cargar la hoja de mapas. Revisa que la URL CSV sea correcta.";
  }

  render();
})();
</script>

</body>
</html>
