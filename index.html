<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de Tesis y Mapas</title>

  <style>
    :root {
      --azul-rey: #2146b5;
      --azul-oscuro: #142b70;
      --azul-claro: #edf2ff;
      --plata: #cbd0d8;
      --plata-claro: #f2f4f7;
      --texto: #243047;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--plata-claro);
      color: var(--texto);
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px;
      background: linear-gradient(
        135deg,
        var(--azul-rey),
        var(--azul-oscuro)
      );
      color: white;
      border-bottom: 5px solid var(--plata);
      box-shadow: 0 4px 14px rgb(0 0 0 / 12%);
    }

    /* Se conserva la imagen original sin recortes ni filtros. */
    .logo-biblioteca {
      display: block;
      width: 110px;
      height: auto;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 32px);
    }

    header p {
      margin: 8px 0 0;
      color: #e2e7f2;
      line-height: 1.5;
    }

    main {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .tab,
    .boton-limpiar {
      padding: 12px 22px;
      border: 1px solid var(--plata);
      border-radius: 10px;
      background: #e2e5eb;
      color: var(--azul-oscuro);
      font-weight: 600;
    }

    .tab:hover,
    .boton-limpiar:hover {
      background: #d4d9e3;
    }

    .tab.active {
      background: var(--azul-rey);
      border-color: var(--azul-rey);
      color: white;
      box-shadow: 0 4px 10px rgb(33 70 181 / 20%);
    }

    .panel-filtros,
    .tarjeta {
      padding: 20px;
      border: 1px solid var(--plata);
      border-radius: 16px;
      background: white;
      box-shadow: 0 4px 16px rgb(0 0 0 / 5%);
    }

    .panel-filtros {
      margin-bottom: 20px;
    }

    .filtros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      color: var(--azul-oscuro);
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid var(--plata);
      border-radius: 10px;
      background: white;
      color: var(--texto);
      font: inherit;
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid #a9bef9;
      outline-offset: 2px;
    }

    .acciones {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .status {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-left: 5px solid var(--azul-rey);
      border-radius: 8px;
      background: var(--azul-claro);
      color: var(--azul-oscuro);
      line-height: 1.5;
    }

    .status.error {
      border-left-color: #b42318;
      background: #fff1f0;
      color: #8a1c13;
    }

    .tabla-contenedor {
      overflow-x: auto;
      border: 1px solid var(--plata);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 12px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: var(--azul-rey);
      color: white;
    }

    td {
      border-bottom: 1px solid #e2e5eb;
      overflow-wrap: anywhere;
    }

    tbody tr:nth-child(even) {
      background: #f5f6f9;
    }

    tbody tr:hover {
      background: var(--azul-claro);
    }

    .sin-resultados {
      text-align: center;
      padding: 28px;
      color: #58667d;
    }

    [hidden] {
      display: none !important;
    }

    footer {
      padding: 24px 16px;
      text-align: center;
      color: #58667d;
      font-size: 13px;
    }

    @media (max-width: 720px) {
      header {
        padding: 16px;
        gap: 12px;
        align-items: center;
      }

      .logo-biblioteca {
        width: 80px;
      }

      header h1 {
        font-size: 20px;
      }

      header p {
        font-size: 13px;
      }

      .filtros {
        grid-template-columns: 1fr;
      }

      .panel-filtros,
      .tarjeta {
        padding: 14px;
      }

      table {
        min-width: 650px;
      }

      .tabs .tab {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <header>
    <img
      class="logo-biblioteca"
      src="./logo-biblioteca.jpeg"
      alt="Logo de la Biblioteca Ing. Daniel Gutiérrez Gutiérrez"
    >

    <div>
      <h1>Buscador de Tesis y Mapas</h1>
      <p>Consulta el catálogo y encuentra la ubicación de los materiales.</p>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="Seleccionar catálogo">
      <button
        id="boton-tesis"
        class="tab active"
        type="button"
        aria-pressed="true"
        onclick="mostrarCatalogo('tesis')"
      >
        Tesis
      </button>

      <button
        id="boton-mapas"
        class="tab"
        type="button"
        aria-pressed="false"
        onclick="mostrarCatalogo('mapas')"
      >
        Mapas
      </button>
    </nav>

    <section class="panel-filtros" aria-label="Filtros de búsqueda">
      <div id="filtros-tesis" class="filtros">
        <div>
          <label for="filtro-titulo">Título de la tesis</label>
          <input
            id="filtro-titulo"
            type="search"
            placeholder="Escribe parte del título..."
            oninput="render()"
          >
        </div>

        <div>
          <label for="filtro-carrera">Carrera</label>
          <select id="filtro-carrera" onchange="render()">
            <option value="">Todas las carreras</option>
          </select>
        </div>
      </div>

      <div id="filtros-mapas" class="filtros" hidden>
        <div>
          <label for="filtro-tipo-mapa">Tipo de mapa</label>
          <select id="filtro-tipo-mapa" onchange="render()">
            <option value="">Todos los tipos de mapa</option>
          </select>
        </div>

        <div>
          <label for="filtro-escala">Escala</label>
          <select id="filtro-escala" onchange="render()">
            <option value="">Todas las escalas</option>
          </select>
        </div>
      </div>

      <div>
        <label for="buscador">Búsqueda general</label>
        <input
          id="buscador"
          type="search"
          placeholder="Buscar en el catálogo de tesis..."
          oninput="render()"
        >
      </div>

      <div class="acciones">
        <button
          class="boton-limpiar"
          type="button"
          onclick="limpiarFiltros()"
        >
          Limpiar filtros
        </button>
      </div>
    </section>

    <section id="seccion-tesis" class="tarjeta" aria-label="Resultados de tesis">
      <p id="estado-tesis" class="status" role="status" aria-live="polite">
        Cargando tesis...
      </p>

      <div class="tabla-contenedor">
        <table aria-label="Catálogo de tesis">
          <thead>
            <tr>
              <th scope="col">Número de tesis</th>
              <th scope="col">Nombre de tesis</th>
              <th scope="col">Nombre del titulado</th>
              <th scope="col">Carrera</th>
              <th scope="col">Año</th>
              <th scope="col">Ubicación</th>
            </tr>
          </thead>
          <tbody id="tabla-tesis"></tbody>
        </table>
      </div>
    </section>

    <section
      id="seccion-mapas"
      class="tarjeta"
      aria-label="Resultados de mapas"
      hidden
    >
      <p id="estado-mapas" class="status" role="status" aria-live="polite">
        Cargando mapas...
      </p>

      <div class="tabla-contenedor">
        <table aria-label="Catálogo de mapas">
          <thead>
            <tr>
              <th scope="col">Clave del mapa</th>
              <th scope="col">Tipo de mapa</th>
              <th scope="col">Escala</th>
              <th scope="col">Estado</th>
              <th scope="col">Ubicación</th>
            </tr>
          </thead>
          <tbody id="tabla-mapas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    Biblioteca · Catálogo de tesis y mapas
  </footer>

  <script>
    // Coloca aquí los enlaces publicados en formato CSV.
    const URL_TESIS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTGPGsoufXmVyYnyeAbPBFEoBVp-_7Q3R45Hr4lOs_FaWdAWmSkXPIkwskHt5hRRw/pub?gid=1390219014&single=true&output=csv";
    const URL_MAPAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpgYSzQaFIQhRiu6jgT7Du92QuFuXPf5-34QCuq8Yv_ZO3qlQzNh6bh9P4GT3_qeKMN03YzTAl4kRk/pub?output=csv";

    const CAMPOS_TESIS = [
      "numero_tesis",
      "nombre_tesis",
      "nombre_titulado",
      "carrera",
      "anio",
      "ubicacion"
    ];

    const CAMPOS_MAPAS = [
      "clave_mapa",
      "tipo_mapa",
      "escala",
      "estado",
      "ubicacion"
    ];

    const catalogos = {
      tesis: {
        datos: [],
        cargando: true,
        error: ""
      },
      mapas: {
        datos: [],
        cargando: true,
        error: ""
      }
    };

    let catalogoActivo = "tesis";

    function normalizar(valor) {
      return String(valor ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/s+/g, " ")
        .trim();
    }

    function normalizarEncabezado(valor) {
      return normalizar(valor).replace(/s+/g, "_");
    }

    // Lee comas, comillas escapadas y saltos de línea dentro de celdas.
    function parsearCSV(texto) {
      const contenido = texto.replace(/^﻿/, "");
      const filas = [];
      let fila = [];
      let celda = "";
      let entreComillas = false;

      for (let i = 0; i < contenido.length; i++) {
        const caracter = contenido[i];

        if (caracter === '"') {
          if (entreComillas && contenido[i + 1] === '"') {
            celda += '"';
            i++;
          } else {
            entreComillas = !entreComillas;
          }
        } else if (caracter === "," && !entreComillas) {
          fila.push(celda);
          celda = "";
        } else if (
          (caracter === "
" || caracter === "
") &&
          !entreComillas
        ) {
          if (caracter === "
" && contenido[i + 1] === "
") {
            i++;
          }

          fila.push(celda);

          if (fila.some(valor => valor.trim() !== "")) {
            filas.push(fila);
          }

          fila = [];
          celda = "";
        } else {
          celda += caracter;
        }
      }

      if (entreComillas) {
        throw new Error("El CSV contiene comillas sin cerrar.");
      }

      fila.push(celda);

      if (fila.some(valor => valor.trim() !== "")) {
        filas.push(fila);
      }

      if (filas.length === 0) {
        throw new Error("La hoja está vacía o no contiene encabezados.");
      }

      const encabezados = filas.shift().map(normalizarEncabezado);

      if (new Set(encabezados).size !== encabezados.length) {
        throw new Error("Hay encabezados duplicados en la hoja.");
      }

      const datos = filas.map(valores =>
        Object.fromEntries(
          encabezados.map((campo, indice) => [
            campo,
            (valores[indice] ?? "").trim()
          ])
        )
      );

      return { encabezados, datos };
    }

    async function cargarCSV(url, camposRequeridos) {
      if (!url || url.includes("PEGA_AQUI")) {
        throw new Error("Falta configurar el enlace CSV de esta hoja.");
      }

      const respuesta = await fetch(url);

      if (!respuesta.ok) {
        throw new Error(
          `No se pudo descargar la hoja. Código HTTP: ${respuesta.status}.`
        );
      }

      const texto = await respuesta.text();

      if (/^s*</.test(texto)) {
        throw new Error(
          "El enlace devolvió una página HTML. Usa el enlace publicado como CSV."
        );
      }

      const { encabezados, datos } = parsearCSV(texto);

      const faltantes = camposRequeridos.filter(
        campo => !encabezados.includes(campo)
      );

      if (faltantes.length > 0) {
        throw new Error(
          "Faltan estas columnas: " + faltantes.join(", ") + "."
        );
      }

      // Conserva solamente los campos utilizados por el catálogo.
      return datos
        .map(fila =>
          Object.fromEntries(
            camposRequeridos.map(campo => [campo, fila[campo] ?? ""])
          )
        )
        .filter(fila => Object.values(fila).some(valor => valor !== ""));
    }

    function llenarSelect(id, valores, textoInicial) {
      const select = document.getElementById(id);
      const opciones = new Map();

      valores.forEach(valor => {
        const etiqueta = String(valor ?? "").trim();
        const clave = normalizar(etiqueta);

        if (clave && !opciones.has(clave)) {
          opciones.set(clave, etiqueta);
        }
      });

      select.replaceChildren(new Option(textoInicial, ""));

      [...opciones.entries()]
        .sort((a, b) =>
          a[1].localeCompare(b[1], "es", {
            numeric: true,
            sensitivity: "base"
          })
        )
        .forEach(([clave, etiqueta]) => {
          select.add(new Option(etiqueta, clave));
        });
    }

    function cargarFiltros(tipo) {
      if (tipo === "tesis") {
        llenarSelect(
          "filtro-carrera",
          catalogos.tesis.datos.map(t => t.carrera),
          "Todas las carreras"
        );
      } else {
        llenarSelect(
          "filtro-tipo-mapa",
          catalogos.mapas.datos.map(m => m.tipo_mapa),
          "Todos los tipos de mapa"
        );

        llenarSelect(
          "filtro-escala",
          catalogos.mapas.datos.map(m => m.escala),
          "Todas las escalas"
        );
      }
    }

    function mostrarTabla(id, datos, campos, mensajeVacio) {
      const cuerpo = document.getElementById(id);
      const fragmento = document.createDocumentFragment();

      if (datos.length === 0) {
        const fila = document.createElement("tr");
        const celda = document.createElement("td");

        celda.colSpan = campos.length;
        celda.className = "sin-resultados";
        celda.textContent = mensajeVacio;

        fila.appendChild(celda);
        fragmento.appendChild(fila);
      } else {
        datos.forEach(registro => {
          const fila = document.createElement("tr");

          campos.forEach(campo => {
            const celda = document.createElement("td");
            celda.textContent = registro[campo] || "—";
            fila.appendChild(celda);
          });

          fragmento.appendChild(fila);
        });
      }

      cuerpo.replaceChildren(fragmento);
    }

    function actualizarEstado(tipo, cantidad) {
      const catalogo = catalogos[tipo];
      const estado = document.getElementById("estado-" + tipo);

      estado.classList.toggle("error", Boolean(catalogo.error));

      if (catalogo.cargando) {
        estado.textContent = `Cargando ${tipo}...`;
      } else if (catalogo.error) {
        estado.textContent = catalogo.error;
      } else {
        estado.textContent =
          `${cantidad} de ${catalogo.datos.length} registros encontrados.`;
      }
    }

    function render() {
      const busqueda = normalizar(
        document.getElementById("buscador").value
      );

      const titulo = normalizar(
        document.getElementById("filtro-titulo").value
      );

      const carrera =
        document.getElementById("filtro-carrera").value;

      const tipoMapa =
        document.getElementById("filtro-tipo-mapa").value;

      const escala =
        document.getElementById("filtro-escala").value;

      const tesisFiltradas = catalogos.tesis.datos.filter(t => {
        const coincideBusqueda = normalizar(
          Object.values(t).join(" ")
        ).includes(busqueda);

        const coincideTitulo =
          normalizar(t.nombre_tesis).includes(titulo);

        const coincideCarrera =
          !carrera || normalizar(t.carrera) === carrera;

        return coincideBusqueda && coincideTitulo && coincideCarrera;
      });

      const mapasFiltrados = catalogos.mapas.datos.filter(m => {
        const coincideBusqueda = normalizar(
          Object.values(m).join(" ")
        ).includes(busqueda);

        const coincideTipo =
          !tipoMapa || normalizar(m.tipo_mapa) === tipoMapa;

        const coincideEscala =
          !escala || normalizar(m.escala) === escala;

        return coincideBusqueda && coincideTipo && coincideEscala;
      });

      mostrarTabla(
        "tabla-tesis",
        tesisFiltradas,
        CAMPOS_TESIS,
        catalogos.tesis.cargando
          ? "Cargando catálogo..."
          : catalogos.tesis.error
            ? "Catálogo no disponible."
            : "No hay tesis que coincidan con los filtros."
      );

      mostrarTabla(
        "tabla-mapas",
        mapasFiltrados,
        CAMPOS_MAPAS,
        catalogos.mapas.cargando
          ? "Cargando catálogo..."
          : catalogos.mapas.error
            ? "Catálogo no disponible."
            : "No hay mapas que coincidan con los filtros."
      );

      actualizarEstado("tesis", tesisFiltradas.length);
      actualizarEstado("mapas", mapasFiltrados.length);
    }

    function mostrarCatalogo(tipo) {
      catalogoActivo = tipo;

      ["tesis", "mapas"].forEach(nombre => {
        const activo = nombre === tipo;

        document.getElementById("seccion-" + nombre).hidden = !activo;
        document.getElementById("filtros-" + nombre).hidden = !activo;

        const boton = document.getElementById("boton-" + nombre);
        boton.classList.toggle("active", activo);
        boton.setAttribute("aria-pressed", String(activo));
      });

      const buscador = document.getElementById("buscador");
      buscador.value = "";
      buscador.placeholder = `Buscar en el catálogo de ${tipo}...`;

      render();
    }

    function limpiarFiltros() {
      document.getElementById("buscador").value = "";

      const ids = catalogoActivo === "tesis"
        ? ["filtro-titulo", "filtro-carrera"]
        : ["filtro-tipo-mapa", "filtro-escala"];

      ids.forEach(id => {
        document.getElementById(id).value = "";
      });

      render();
    }

    async function cargarCatalogo(tipo, url, campos) {
      const catalogo = catalogos[tipo];

      try {
        catalogo.datos = await cargarCSV(url, campos);
        cargarFiltros(tipo);
      } catch (error) {
        catalogo.error =
          `Error al cargar ${tipo}: ${error.message} ` +
          "Revisa el enlace CSV y los permisos de publicación.";
      } finally {
        catalogo.cargando = false;
        render();
      }
    }

    render();

    Promise.all([
      cargarCatalogo("tesis", URL_TESIS, CAMPOS_TESIS),
      cargarCatalogo("mapas", URL_MAPAS, CAMPOS_MAPAS)
    ]);
  </script>
</body>
  </html>
